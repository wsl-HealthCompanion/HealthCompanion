name: Pull Request CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yhzk-demo-h5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yhzk-demo-h5/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yhzk-demo-h5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yhzk-demo-h5/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  nest-build:
    name: NestJS Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yhzk-mvp-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yhzk-mvp-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  nest-jest:
    name: NestJS Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yhzk-mvp-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yhzk-mvp-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --runInBand

  python-pytest:
    name: Python pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
