name: Xmov M1.3 Task 3 Build RED

on:
  push:
    branches:
      - feat/xmov-m1-action-lab
    paths:
      - '.github/workflows/xmov-m1-temp.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yhzk-demo-h5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yhzk-demo-h5/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Require Action Lab production entry
        run: test -f dist/xmov-action-lab.html
