name: Xmov M1.3 Final Verification

on:
  push:
    branches:
      - feat/xmov-m1-action-lab
    paths:
      - '.github/workflows/xmov-m1-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yhzk-demo-h5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yhzk-demo-h5/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Action Lab tests
        run: npm run test:xmov-action-lab
      - name: Build frontend
        run: npm run build
      - name: Verify all production HTML entries
        run: |
          test -f dist/index.html
          test -f dist/xmov-task1.html
          test -f dist/xmov-action-lab.html
