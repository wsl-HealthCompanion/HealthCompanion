name: Xmov M1.3 Task 1 TDD

on:
  push:
    branches:
      - feat/xmov-m1-action-lab
    paths:
      - 'yhzk-demo-h5/src/avatar/xmovActions.spec.ts'
      - 'yhzk-demo-h5/src/avatar/xmovActions.ts'
      - '.github/workflows/xmov-m1-temp.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yhzk-demo-h5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yhzk-demo-h5/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Action Lab API client spec
        run: npm run test:xmov-action-lab -- src/avatar/xmovActions.spec.ts
