name: Xmov M1 Baseline Verification

on:
  push:
    branches:
      - feat/xmov-m1-action-lab
    paths:
      - '.github/workflows/xmov-m1-temp.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yhzk-mvp-backend
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: abc4f69fd61cc1217a385ec94014e1343634e339
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yhzk-mvp-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run baseline full backend suite
        run: >
          npx jest
          --runInBand
          --config='{"moduleFileExtensions":["js","json","ts"],"rootDir":".","testRegex":".*\\.spec\\.ts$","transform":{"^.+\\.(t|j)s$":"ts-jest"},"testEnvironment":"node"}'
