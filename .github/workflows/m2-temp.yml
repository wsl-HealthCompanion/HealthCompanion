name: M2.1 Final Verification

on:
  push:
    branches:
      - feat/pose-shoulder-loop
    paths:
      - '.github/workflows/m2-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yhzk-demo-h5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yhzk-demo-h5/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Pose Lab tests
        run: npm run test:pose-lab
      - name: Run M1 Action Lab regression
        run: npm run test:xmov-action-lab
      - name: Build frontend
        run: npm run build
      - name: Verify production pages
        run: |
          test -f dist/index.html
          test -f dist/xmov-task1.html
          test -f dist/xmov-action-lab.html
          test -f dist/pose-lab.html
