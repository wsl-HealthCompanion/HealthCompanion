name: M2.1 Task 1 Camera RED

on:
  push:
    branches:
      - feat/pose-shoulder-loop
    paths:
      - 'yhzk-demo-h5/src/pose/cameraSession.spec.ts'
      - 'yhzk-demo-h5/src/pose/cameraSession.ts'
      - '.github/workflows/m2-temp.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yhzk-demo-h5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yhzk-demo-h5/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run CameraSession spec
        run: npx vitest run src/pose/cameraSession.spec.ts
