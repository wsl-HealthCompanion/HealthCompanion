name: M2.1 Task 2 Bootstrap MediaPipe

on:
  push:
    branches:
      - feat/pose-shoulder-loop
    paths:
      - '.github/workflows/m2-temp.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yhzk-demo-h5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/pose-shoulder-loop
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yhzk-demo-h5/package-lock.json
      - name: Install pinned MediaPipe
        run: npm install --save-exact @mediapipe/tasks-vision@1.0.1
      - name: Commit generated dependency files
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yhzk-demo-h5/package.json yhzk-demo-h5/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(pose): pin MediaPipe tasks vision"
          git push
