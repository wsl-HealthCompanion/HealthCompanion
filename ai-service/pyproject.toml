[project]
name = "yhzk-ai-service"
version = "0.1.0"
description = "炎华众康 AI Service - LangGraph Multi-Agent Orchestration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.50",
    "langchain-milvus>=0.1.6",
    "pymilvus>=2.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "gunicorn>=23.0.0",
    "redis[hiredis]>=5.2.0",
]

[project.optional-dependencies]
phase2 = [
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "celery>=5.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = '-m "not integration"'
markers = ["integration: requires external services or API credentials"]
